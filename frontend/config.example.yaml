# Copy this file to config.yaml (which is git-ignored) before running the app:
#   cp config.example.yaml config.yaml
# Users are added to config.yaml automatically through the Sign Up page.
cookie:
  expiry_days: 30
  # Replace with a long random string, e.g.  python -c "import secrets; print(secrets.token_hex(32))"
  key: CHANGE_ME_TO_A_LONG_RANDOM_STRING
  name: teleco_tutor_auth
credentials:
  usernames: {}
