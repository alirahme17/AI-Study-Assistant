# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Secrets marked sync: false are asked for once in the dashboard (never stored in git).
services:
  - type: web
    name: teleco-tutor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        value: https://ivmtsaeldwzxbiyalkqk.supabase.co
      - key: STORAGE_BACKEND
        value: supabase
      - key: STORAGE_BUCKET
        value: pdfs
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
